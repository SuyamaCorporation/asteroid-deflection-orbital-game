<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小惑星偏向軌道操作ゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-start p-4">
<h1 class="text-2xl font-bold text-cyan-300 mt-4 mb-1">小惑星偏向軌道操作ゲーム</h1>
<p class="text-gray-400 text-sm mb-3">KINETIC IMPACTORで小惑星の軌道を偏向し、地球を守れ！</p>

<div class="flex flex-wrap gap-4 justify-center mb-3">
  <div class="bg-gray-800 rounded px-3 py-1 text-sm">
    難易度:
    <select id="diffSelect" aria-label="難易度選択" class="bg-gray-700 text-white rounded px-2 py-0.5 ml-1">
      <option value="easy">EASY</option>
      <option value="normal" selected>NORMAL</option>
      <option value="hard">HARD</option>
    </select>
  </div>
  <div class="bg-gray-800 rounded px-3 py-1 text-sm">
    インパクト角度: <span id="angleVal" class="text-yellow-300 font-bold">0°</span>
    <input type="range" id="angleSlider" min="-60" max="60" value="0" aria-label="インパクト角度" class="ml-2 w-28 align-middle">
  </div>
  <div class="bg-gray-800 rounded px-3 py-1 text-sm">
    インパクト強度: <span id="powerVal" class="text-yellow-300 font-bold">50</span>
    <input type="range" id="powerSlider" min="10" max="100" value="50" aria-label="インパクト強度" class="ml-2 w-28 align-middle">
  </div>
</div>

<div class="relative">
  <canvas id="gameCanvas" width="600" height="400" class="rounded-lg border border-cyan-800 bg-black block" aria-label="ゲームキャンバス"></canvas>
  <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-70 rounded-lg hidden">
    <div id="overlayTitle" class="text-4xl font-bold mb-4"></div>
    <div id="overlayMsg" class="text-lg text-gray-300 mb-6"></div>
    <button id="restartBtn" aria-label="ゲームリスタート" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-8 py-3 rounded-lg text-lg">RESTART</button>
  </div>
</div>

<div class="flex gap-4 mt-3">
  <button id="deflectBtn" aria-label="偏向弾発射" class="bg-orange-600 hover:bg-orange-500 disabled:opacity-40 text-white font-bold px-8 py-3 rounded-lg text-lg transition">DEFLECT!</button>
  <button id="newGameBtn" aria-label="新しいゲーム開始" class="bg-gray-700 hover:bg-gray-600 text-white font-bold px-6 py-3 rounded-lg text-lg transition">NEW GAME</button>
</div>

<div class="flex gap-6 mt-3 text-sm text-gray-400">
  <span>スコア: <span id="scoreVal" class="text-green-400 font-bold">0</span></span>
  <span>残弾: <span id="ammoVal" class="text-yellow-400 font-bold">3</span></span>
  <span>ステージ: <span id="stageVal" class="text-cyan-400 font-bold">1</span></span>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Game state
let state = 'playing'; // playing, deflected, gameover, clear
let asteroid = {};
let impactor = null;
let particles = [];
let score = 0;
let ammo = 3;
let stage = 1;
let animId;
let deflected = false;

const EARTH_X = 60, EARTH_Y = H / 2, EARTH_R = 28;

function getDiff() {
  return document.getElementById('diffSelect').value;
}

function initAsteroid() {
  const diff = getDiff();
  const speeds = { easy: 0.6, normal: 1.0, hard: 1.5 };
  const radiuses = { easy: 18, normal: 14, hard: 10 };
  const spd = speeds[diff];
  // Trajectory: starts far right, aimed slightly toward earth with some variance
  const targetOffsetY = (Math.random() - 0.5) * 60;
  const startY = H / 2 + (Math.random() - 0.5) * 100;
  const dx = EARTH_X - W + 20;
  const dy = (EARTH_Y + targetOffsetY) - startY;
  const len = Math.sqrt(dx * dx + dy * dy);
  asteroid = {
    x: W - 20,
    y: startY,
    vx: (dx / len) * spd,
    vy: (dy / len) * spd,
    r: radiuses[diff],
    origVx: (dx / len) * spd,
    origVy: (dy / len) * spd,
    trail: [],
    deflected: false,
    deflectProgress: 0
  };
  deflected = false;
  impactor = null;
  particles = [];
}

function init() {
  ammo = 3;
  deflected = false;
  impactor = null;
  particles = [];
  document.getElementById('deflectBtn').disabled = false;
  document.getElementById('overlay').classList.add('hidden');
  updateHUD();
  initAsteroid();
  if (animId) cancelAnimationFrame(animId);
  loop();
}

function newGame() {
  score = 0;
  stage = 1;
  init();
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('ammoVal').textContent = ammo;
  document.getElementById('stageVal').textContent = stage;
}

function fireDeflect() {
  if (deflected || ammo <= 0 || state !== 'playing') return;
  ammo--;
  updateHUD();
  const angleDeg = parseInt(document.getElementById('angleSlider').value);
  const power = parseInt(document.getElementById('powerSlider').value);
  const angleRad = angleDeg * Math.PI / 180;
  // Impactor flies from right edge toward asteroid
  impactor = {
    x: W - 10,
    y: H / 2 - 60,
    tx: asteroid.x,
    ty: asteroid.y,
    speed: 4,
    hit: false,
    angle: angleRad,
    power: power
  };
  if (ammo <= 0) document.getElementById('deflectBtn').disabled = true;
}

function applyDeflection(angle, power) {
  const diff = getDiff();
  const scale = { easy: 0.025, normal: 0.015, hard: 0.009 }[diff];
  const dvx = -Math.sin(angle) * power * scale;
  const dvy = -Math.cos(angle) * power * scale * 0.8;
  asteroid.vx += dvx;
  asteroid.vy += dvy;
  deflected = true;
  // Spawn explosion particles
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push({ x: asteroid.x, y: asteroid.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 1, r: Math.random() * 4 + 1 });
  }
}

function checkCollision() {
  const dx = asteroid.x - EARTH_X;
  const dy = asteroid.y - EARTH_Y;
  return Math.sqrt(dx * dx + dy * dy) < (EARTH_R + asteroid.r - 4);
}

function checkClear() {
  return asteroid.x < -50 && !checkCollision();
}

function showOverlay(title, msg, color) {
  const ov = document.getElementById('overlay');
  const ot = document.getElementById('overlayTitle');
  const om = document.getElementById('overlayMsg');
  ot.textContent = title;
  ot.style.color = color;
  om.textContent = msg;
  ov.classList.remove('hidden');
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawEarth();
  updateAndDrawAsteroid();
  updateAndDrawImpactor();
  drawParticles();
  drawHUD();
  animId = requestAnimationFrame(loop);
}

function drawBackground() {
  // Stars
  if (!loop.stars) {
    loop.stars = [];
    for (let i = 0; i < 120; i++) {
      loop.stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.3, br: Math.random() });
    }
  }
  for (const s of loop.stars) {
    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(Date.now() * 0.001 * s.br + s.x));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function drawEarth() {
  // Glow
  const grd = ctx.createRadialGradient(EARTH_X, EARTH_Y, EARTH_R * 0.5, EARTH_X, EARTH_Y, EARTH_R * 2);
  grd.addColorStop(0, 'rgba(100,180,255,0.3)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(EARTH_X, EARTH_Y, EARTH_R * 2, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();
  // Earth body
  const eg = ctx.createRadialGradient(EARTH_X - 8, EARTH_Y - 8, 2, EARTH_X, EARTH_Y, EARTH_R);
  eg.addColorStop(0, '#4fc3f7');
  eg.addColorStop(0.5, '#1565c0');
  eg.addColorStop(1, '#0d47a1');
  ctx.beginPath();
  ctx.arc(EARTH_X, EARTH_Y, EARTH_R, 0, Math.PI * 2);
  ctx.fillStyle = eg;
  ctx.fill();
  // Land patches
  ctx.fillStyle = '#388e3c';
  ctx.beginPath(); ctx.ellipse(EARTH_X - 6, EARTH_Y - 6, 9, 6, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(EARTH_X + 8, EARTH_Y + 4, 7, 5, -0.3, 0, Math.PI * 2); ctx.fill();
}

function updateAndDrawAsteroid() {
  if (state !== 'playing') return;
  // Trail
  asteroid.trail.push({ x: asteroid.x, y: asteroid.y });
  if (asteroid.trail.length > 25) asteroid.trail.shift();
  for (let i = 0; i < asteroid.trail.length; i++) {
    const alpha = i / asteroid.trail.length * 0.5;
    ctx.beginPath();
    ctx.arc(asteroid.trail[i].x, asteroid.trail[i].y, asteroid.r * (i / asteroid.trail.length) * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,160,50,${alpha})`;
    ctx.fill();
  }
  // Asteroid body
  ctx.save();
  ctx.translate(asteroid.x, asteroid.y);
  const ag = ctx.createRadialGradient(-asteroid.r * 0.3, -asteroid.r * 0.3, 1, 0, 0, asteroid.r);
  ag.addColorStop(0, '#bdbdbd');
  ag.addColorStop(1, '#4a4a4a');
  ctx.beginPath();
  ctx.arc(0, 0, asteroid.r, 0, Math.PI * 2);
  ctx.fillStyle = ag;
  ctx.fill();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
  // Projected path line
  if (!deflected) {
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(255,100,100,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(asteroid.x, asteroid.y);
    let px = asteroid.x, py = asteroid.y;
    for (let i = 0; i < 300; i++) {
      px += asteroid.vx * 2;
      py += asteroid.vy * 2;
      if (px < 0 || px > W || py < 0 || py > H) break;
    }
    ctx.lineTo(px, py);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // Update position
  asteroid.x += asteroid.vx;
  asteroid.y += asteroid.vy;
  // Check conditions
  if (checkCollision()) {
    state = 'gameover';
    cancelAnimationFrame(animId);
    drawBackground(); drawEarth(); updateAndDrawAsteroid();
    showOverlay('GAME OVER', `地球が衝突した！スコア: ${score}`, '#ff4444');
    return;
  }
  if (asteroid.x < -60) {
    // Passed earth
    if (Math.abs(asteroid.y - EARTH_Y) > EARTH_R + asteroid.r) {
      score += stage * 100 * (deflected ? 1 : 2);
      stage++;
      updateHUD();
      cancelAnimationFrame(animId);
      showOverlay('DEFLECT SUCCESS!', `次のステージへ！スコア: ${score}`, '#00e676');
      state = 'clear';
      setTimeout(() => { state = 'playing'; init(); }, 2200);
    }
  }
}

function updateAndDrawImpactor() {
  if (!impactor || impactor.hit) return;
  // Move toward asteroid
  const dx = asteroid.x - impactor.x;
  const dy = asteroid.y - impactor.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < asteroid.r + 8) {
    applyDeflection(impactor.angle, impactor.power);
    impactor.hit = true;
    return;
  }
  impactor.x += (dx / dist) * impactor.speed;
  impactor.y += (dy / dist) * impactor.speed;
  // Draw impactor
  ctx.save();
  ctx.translate(impactor.x, impactor.y);
  ctx.rotate(Math.atan2(dy, dx));
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-6, 5);
  ctx.lineTo(-6, -5);
  ctx.closePath();
  ctx.fill();
  // Thrust
  ctx.fillStyle = 'rgba(255,100,0,0.7)';
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(-14, 4);
  ctx.lineTo(-14, -4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,${Math.floor(200 * p.life)},50,${p.life})`;
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,200,255,0.8)';
  ctx.font = '12px monospace';
  ctx.fillText(`STAGE ${stage}  SCORE ${score}  AMMO ${ammo}`, 10, 20);
  ctx.fillText(`角度: ${document.getElementById('angleSlider').value}°  強度: ${document.getElementById('powerSlider').value}`, 10, 36);
}

document.getElementById('angleSlider').addEventListener('input', function() {
  document.getElementById('angleVal').textContent = this.value + '°';
});
document.getElementById('powerSlider').addEventListener('input', function() {
  document.getElementById('powerVal').textContent = this.value;
});
document.getElementById('deflectBtn').addEventListener('click', fireDeflect);
document.getElementById('newGameBtn').addEventListener('click', newGame);
document.getElementById('restartBtn').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
